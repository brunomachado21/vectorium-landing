<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestão financeira inteligente para microempreendedores.">

  <!--
    Content Security Policy completa para Flutter Web:
    - gstatic.com           : CanvasKit (engine de renderização Flutter)
    - fonts.gstatic.com     : fontes Roboto e Material Icons
    - fonts.googleapis.com  : stylesheet das fontes
    - accounts.google.com   : Google Sign-In (GSI client)
    - *.googleapis.com      : APIs Google em geral
    - unsafe-eval           : dart2js + sqlite3.wasm
    - wasm-unsafe-eval      : WebAssembly (Drift/sqlite3)
    - unsafe-inline         : Flutter bootstrap scripts
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src  'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'
                             https://www.gstatic.com
                             https://accounts.google.com
                             https://*.googleapis.com;
                 style-src   'self' 'unsafe-inline'
                             https://fonts.googleapis.com
                             https://accounts.google.com;
                 img-src     'self' data: blob:
                             https://www.gstatic.com
                             https://*.googleusercontent.com;
                 font-src    'self' data:
                             https://fonts.gstatic.com;
                 connect-src 'self'
                             https://*.supabase.co wss://*.supabase.co https://supabase.io
                             https://www.gstatic.com
                             https://fonts.gstatic.com
                             https://fonts.googleapis.com
                             https://accounts.google.com
                             https://*.googleapis.com;
                 frame-src   https://accounts.google.com;
                 worker-src  'self' blob:;
                 child-src   blob: https://accounts.google.com;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Metricora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Metricora</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
