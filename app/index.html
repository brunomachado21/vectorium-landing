<html>
<head>
  <base href="/app/">

  <meta name="description" content="Gestão financeira inteligente para microempreendedores.">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src  'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'

                 style-src   'self' 'unsafe-inline'
                             https://fonts.googleapis.com
                             https://accounts.google.com;
                 img-src     'self' data: blob:
                             https://www.gstatic.com
                             https://*.googleusercontent.com;
                 font-src    'self' data:
                             https://fonts.gstatic.com;
                 connect-src 'self'
                             https://*.supabase.co wss://*.supabase.co https://supabase.io
                             https://www.gstatic.com
                             https://fonts.gstatic.com
                             https://fonts.googleapis.com
                             https://accounts.google.com

                 worker-src  'self' blob:;
                 child-src   blob: https://accounts.google.com;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Metricora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Metricora</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Banner PWA base ──────────────────────────────── */
    #pwa-banner {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(37,99,235,0.18), 0 2px 8px rgba(0,0,0,0.10);
      padding: 14px 20px;
      min-width: 300px;
      max-width: 90vw;
      align-items: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border: 1.5px solid rgba(37,99,235,0.12);
      animation: slideUp 0.35s cubic-bezier(.22,.68,0,1.2) both;
    }
    #pwa-banner.visible { display: flex; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #pwa-banner img {
      width: 48px; height: 48px;
      border-radius: 10px; flex-shrink: 0;
    }
    #pwa-banner-text { flex: 1; }
    #pwa-banner-text strong {
      display: block; color: #0f172a;
      font-size: 14px; font-weight: 700;
    }
    #pwa-banner-text span {
      display: block; color: #475569;
      font-size: 12px; margin-top: 2px; line-height: 1.4;
    }
    #pwa-banner-actions {
      display: flex; flex-direction: column;
      gap: 6px; flex-shrink: 0;
    }
    #pwa-install-btn {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(37,99,235,0.30);
      transition: opacity 0.15s;
    }
    #pwa-install-btn:hover { opacity: 0.88; }
    #pwa-dismiss-btn {
      background: transparent; color: #94a3b8;
      border: none; font-size: 11px;
      cursor: pointer; text-align: center; padding: 2px;
    }
    #pwa-dismiss-btn:hover { color: #64748b; }

    /* ── Seta iOS apontando para o botão de compartilhar ───────── */
    #pwa-ios-arrow {
      display: none;
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      pointer-events: none;
    }
    #pwa-ios-arrow.visible { display: block; }
    #pwa-ios-arrow svg {
      filter: drop-shadow(0 2px 6px rgba(37,99,235,0.25));
      animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(8px); }
    }

    /* ── Banner de atualização disponível ──────────────────── */
    #update-banner {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      background: #0f172a;
      border: 1.5px solid #2563eb;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(37,99,235,0.25), 0 2px 8px rgba(0,0,0,0.20);
      padding: 12px 18px;
      min-width: 280px;
      max-width: 92vw;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: slideDown 0.35s cubic-bezier(.22,.68,0,1.2) both;
    }
    #update-banner.visible { display: flex; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-24px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #update-banner-icon {
      font-size: 22px; flex-shrink: 0;
    }
    #update-banner-text { flex: 1; }
    #update-banner-text strong {
      display: block; color: #f1f5f9;
      font-size: 13px; font-weight: 700;
    }
    #update-banner-text span {
      display: block; color: #94a3b8;
      font-size: 11px; margin-top: 2px;
    }
    #update-reload-btn {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37,99,235,0.35);
      transition: opacity 0.15s;
    }
    #update-reload-btn:hover { opacity: 0.88; }
    #update-dismiss-btn {
      background: transparent; color: #475569;
      border: none; font-size: 18px; line-height: 1;
      cursor: pointer; flex-shrink: 0; padding: 2px 4px;
    }
    #update-dismiss-btn:hover { color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Banner de instalação PWA (Chrome / Android / Desktop) -->
  <div id="pwa-banner">
    <img src="icons/Icon-192.png" alt="Metricora">
    <div id="pwa-banner-text">
      <strong>Instalar Metricora</strong>
      <span id="pwa-banner-desc">Adicione à tela inicial e use sem precisar do navegador.</span>
    </div>
    <div id="pwa-banner-actions">
      <button id="pwa-install-btn">📲 Instalar</button>
      <button id="pwa-dismiss-btn">Agora não</button>
    </div>
  </div>

  <!-- Seta animada iOS (aponta para o botão de compartilhar no Safari) -->
  <div id="pwa-ios-arrow">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="20" fill="#2563EB" opacity="0.12"/>
      <path d="M20 10 L20 30 M12 22 L20 30 L28 22" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Banner de atualização disponível -->
  <div id="update-banner">
    <span id="update-banner-icon">✨</span>
    <div id="update-banner-text">
      <strong>Atualização disponível</strong>
      <span>Nova versão do Metricora está pronta. Atualize agora.</span>
    </div>
    <button id="update-reload-btn">↻ Atualizar</button>
    <button id="update-dismiss-btn" title="Dispensar">&times;</button>
  </div>

  <script>
    // ────────────────────────────────────────────────────────────
    // BANNER DE ATUALIZAÇÃO
    // Detecta quando o Flutter service worker novo está em estado
    // "waiting" (i.e., versão nova baixada, aguardando ativação).
    // Ao clicar em Atualizar: envia SKIP_WAITING ao SW e recarrega.
    // ────────────────────────────────────────────────────────────
    const updateBanner     = document.getElementById('update-banner');
    const updateReloadBtn  = document.getElementById('update-reload-btn');
    const updateDismissBtn = document.getElementById('update-dismiss-btn');
    let _waitingSW = null;

    function mostrarBannerUpdate(sw) {
      _waitingSW = sw;
      updateBanner.classList.add('visible');
    }

    updateReloadBtn.addEventListener('click', () => {
      updateBanner.classList.remove('visible');
      if (_waitingSW) {
        // Diz ao SW em espera para ativar imediatamente
        _waitingSW.postMessage({ type: 'SKIP_WAITING' });
      }
      // Recarrega todas as abas abertas do mesmo origin
      window.location.reload();
    });

    updateDismissBtn.addEventListener('click', () => {
      updateBanner.classList.remove('visible');
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        // SW trocou de versão: recarrega para garantir assets novos
        window.location.reload();
      });

      navigator.serviceWorker.ready.then((reg) => {
        // Já há um SW em waiting no momento do carregamento
        if (reg.waiting) {
          mostrarBannerUpdate(reg.waiting);
        }

        // Ouve atualizações futuras durante a sessão
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (!newSW) return;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              // Novo SW instalado, versão anterior ainda ativa → exibe banner
              mostrarBannerUpdate(newSW);
            }
          });
        });
      });
    }

    // ────────────────────────────────────────────────────────────
    // BANNER PWA (instalação)
    // ────────────────────────────────────────────────────────────
    const banner     = document.getElementById('pwa-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');
    const bannerDesc = document.getElementById('pwa-banner-desc');
    const iosArrow   = document.getElementById('pwa-ios-arrow');

    const dismissed = localStorage.getItem('pwa_banner_dismissed');
    const dismissedRecently = dismissed && (Date.now() - parseInt(dismissed)) < 7 * 24 * 60 * 60 * 1000;

    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const isInStandaloneMode = ('standalone' in window.navigator) && window.navigator.standalone;
    const isIosSafari = isIos && isSafari;

    let _deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _deferredPrompt = e;
      if (!dismissedRecently) {
        setTimeout(() => banner.classList.add('visible'), 3000);
      }
    });

    installBtn.addEventListener('click', async () => {
      if (isIosSafari) {
        banner.classList.remove('visible');
        iosArrow.classList.add('visible');
        setTimeout(() => iosArrow.classList.remove('visible'), 8000);
        return;
      }
      if (!_deferredPrompt) return;
      banner.classList.remove('visible');
      _deferredPrompt.prompt();
      const { outcome } = await _deferredPrompt.userChoice;
      _deferredPrompt = null;
      if (outcome === 'accepted') localStorage.removeItem('pwa_banner_dismissed');
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('visible');
      iosArrow.classList.remove('visible');
      localStorage.setItem('pwa_banner_dismissed', Date.now().toString());
    });

    window.addEventListener('appinstalled', () => {
      banner.classList.remove('visible');
      _deferredPrompt = null;
    });

    if (isIosSafari && !isInStandaloneMode && !dismissedRecently) {
      bannerDesc.textContent = 'Toque em \u2191 Compartilhar e depois em "Adicionar \u00e0 Tela de In\u00edcio".';
      installBtn.textContent = '\u2139\ufe0f Ver como instalar';
      setTimeout(() => banner.classList.add('visible'), 3000);
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
<style>
    #pwa-update-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #1F2937; /* Cor escura neutra */
      color: #F9FAFB;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: none; /* Escondido por padrão */
      z-index: 999999; /* Fica acima de TUDO no Flutter */
      font-family: system-ui, -apple-system, sans-serif;
      align-items: center;
      gap: 20px;
      border: 1px solid #374151;
    }
    #pwa-update-toast p {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
    }
    #pwa-update-toast button {
      background-color: #10B981; /* Verde conversivo */
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    #pwa-update-toast button:hover {
      background-color: #059669;
    }
  </style>

  <div id="pwa-update-toast">
    <p>Nova versão disponível!</p>
    <button onclick="forcarAtualizacaoPWA()">Atualizar Agora</button>
  </div>

  <script>
    let workerEmEspera;

    // Detecta quando o Service Worker do Flutter encontra uma atualização
    navigator.serviceWorker.ready.then((registration) => {
      registration.addEventListener('updatefound', () => {
        const novoWorker = registration.installing;
        novoWorker.addEventListener('statechange', () => {
          // Se o novo worker foi instalado e já existe um worker controlando a página...
          if (novoWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // Guarda a referência e mostra o Toast HTML na tela
            workerEmEspera = novoWorker;
            document.getElementById('pwa-update-toast').style.display = 'flex';
          }
        });
      });
    });

    // Função engatilhada pelo botão verde
    function forcarAtualizacaoPWA() {
      if (workerEmEspera) {
        // Envia o comando universal para o Service Worker matar o cache antigo e assumir
        workerEmEspera.postMessage({ type: 'SKIP_WAITING' });
      }
    }

    // Quando o Service Worker antigo for morto e o novo assumir, a página se recarrega sozinha
    let recarregando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregando) return;
      recarregando = true;
      window.location.reload();
    });
  </script>
</body>

</html>
