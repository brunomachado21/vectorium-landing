<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    Content Security Policy:
    - unsafe-eval   : exigido pelo engine do Flutter Web (dart2js) e sqlite3.wasm
    - wasm-unsafe-eval : exigido pelo WebAssembly (sqlite3.wasm via Drift)
    - unsafe-inline : exigido pelo Flutter Web bootstrap
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src  'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval';
                 style-src   'self' 'unsafe-inline';
                 img-src     'self' data: blob:;
                 font-src    'self' data:;
                 connect-src 'self' https://*.supabase.co wss://*.supabase.co https://supabase.io;
                 worker-src  'self' blob:;
                 child-src   blob:;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="metricora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>metricora</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
