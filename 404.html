<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Metricora</title>
  <script>
    // Redireciona para a raiz preservando o path, para o Flutter Router funcionar
    var path = window.location.pathname;
    window.location.replace('/' + '?redirect=' + encodeURIComponent(path));
  </script>
</head>
<body></body>
</html>
