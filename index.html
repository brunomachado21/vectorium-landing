    /* --- BOTÃO FLUTUANTE COM FECHAR --- */
    .whatsapp-wrapper {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      animation: pulse-green 2s infinite;
    }

    /* O botãozinho X para fechar */
    .whatsapp-close {
      position: absolute;
      top: -10px;
      right: -5px;
      background-color: #333;
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }

    .whatsapp-close:hover {
      background-color: #ff4444;
      transform: scale(1.1);
    }

    /* O botão do Zap em si */
    .whatsapp-link {
      background-color: #25D366;
      color: #FFF;
      border-radius: 50px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .whatsapp-link:hover {
      background-color: #1ebc57;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      color: white;
    }
